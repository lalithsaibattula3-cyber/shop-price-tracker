<!DOCTYPE html>
<html>
<head>
    <title>Login - Shop Tracker</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <style>
        body{
            margin:0;
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            background: linear-gradient(
                135deg,
                #dbeafe,
                #c7d2fe,
                #e9d5ff
            );
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:380px;
            padding:35px;
            border-radius:30px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border:1px solid rgba(255,255,255,0.3);
            box-shadow:0 8px 32px rgba(0,0,0,0.15);
            text-align:center;
        }

        h1{
            margin-bottom:10px;
            color:#1d1d1f;
        }

        p{
            color:#555;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:18px;
            margin-bottom:15px;
            background:rgba(255,255,255,0.5);
            font-size:15px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:18px;
            background:#007AFF;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(0,122,255,0.3);
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1>🛒 Shop Tracker</h1>
    <p>Welcome Back</p>

    <form action="/dashboard" method="POST">

        <input type="text"
        placeholder="Username"
        required>

        <input type="password"
        placeholder="Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
