<!DOCTYPE html>
<html>
<head>
    <title>Shop Price Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🛒 Shop Price Tracker</h1>

    <h2>Add Bill</h2>

    <form action="/add" method="POST">

        <label>Item Name</label>
        <input type="text" name="name" placeholder="Enter item name" required>

        <label>Total Price</label>
        <input type="number" name="price" placeholder="Enter total price" required>

        <label>Quantity</label>
        <input type="number" step="0.01" name="quantity" placeholder="Enter quantity" required>

        <label>Unit</label>
        <select name="unit">
            <option>kg</option>
            <option>grams</option>
            <option>litre</option>
            <option>packet</option>
            <option>box</option>
            <option>tin</option>
        </select>

        <button type="submit">Add Bill</button>

    </form>

    <hr>

    <h2>Search Item</h2>

    <form action="/search" method="POST">

        <input type="text" name="item" placeholder="Search item name" required>

        <button type="submit">Search</button>

    </form>

</div>

</body>
</html>
